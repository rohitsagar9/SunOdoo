name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sunodoopower
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sunodoopower?schema=public
      JWT_SECRET: ci-secret-key-sunpower-super-secure
      HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_UPI_ID: sunpower@upi
      NEXT_PUBLIC_UPI_NAME: SunPower Solutions
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate barcode & static demo assets
        run: npm run assets

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Push Database Schema
        run: npm run db:push

      - name: Seed Demo Data
        run: npm run db:seed

      - name: Build API and Web
        run: npm run build

      - name: Start API Server
        env:
          PORT: 4000
        run: |
          npm run start -w @sunodoopower/api &
          npx wait-on http://localhost:4000/api/health -t 30000

      - name: Run Smoke Tests (63 checks)
        run: node scripts/_smoke.mjs

      - name: Start Web Application
        env:
          PORT: 3000
        run: |
          npm run start -w @sunodoopower/web &
          npx wait-on http://localhost:3000 -t 30000

      - name: Re-seed Clean State for Browser Tests
        run: npm run db:seed

      - name: Run Headless Browser E2E Tests (18 checks)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/_browser.mjs
