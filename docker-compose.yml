services:
  db:
    image: postgres:16-alpine
    container_name: sunodoopower-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sunodoopower
    ports:
      - "5432:5432"
    volumes:
      - sunodoopower_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunodoopower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sunodoopower_data:
